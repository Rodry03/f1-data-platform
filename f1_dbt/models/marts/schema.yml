version: 2

models:
  - name: driver_standings
    description: "Clasificación de pilotos por temporada con estadísticas agregadas"
    columns:
      - name: driver_code
        description: "Código de tres letras del piloto (ej. VER, HAM)"
        tests:
          - not_null
      - name: season_year
        description: "Año de la temporada"
        tests:
          - not_null
      - name: total_points
        description: "Puntos totales acumulados en la temporada"
        tests:
          - not_null
      - name: championship_position
        description: "Posición en el campeonato ordenada por puntos"
        tests:
          - not_null
          - unique_combination:
              combination_of_columns:
                - season_year
                - championship_position

  - name: team_performance
    description: "Rendimiento de constructores por temporada"
    columns:
      - name: team_name
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: total_points
        tests:
          - not_null

  - name: fastest_laps_enriched
    description: "Vueltas rápidas por carrera enriquecidas con datos del calendario"
    columns:
      - name: driver_code
        tests:
          - not_null
      - name: lap_time_seconds
        tests:
          - not_null

  - name: track_status_periods
    description: >
      Periodos de estado de pista por carrera: un periodo por fila, desde un cambio
      de estado hasta el siguiente. El último periodo cierra con el fin de sesión.
      Los tiempos son segundos desde el inicio de la sesión.
    tests:
      - dbt_utils.mutually_exclusive_ranges:
          lower_bound_column: start_time_s
          upper_bound_column: end_time_s
          partition_by: race_id
          gaps: not_allowed
      - dbt_utils.expression_is_true:
          expression: "not is_restart_procedure or status_label = 'safety_car'"
    columns:
      - name: race_id
        description: "Identificador de carrera (YYYY-RR)"
        tests:
          - not_null
      - name: period_number
        description: "Orden del periodo dentro de la carrera, empezando en 1"
        tests:
          - not_null
          - unique_combination:
              combination_of_columns:
                - race_id
                - period_number
      - name: status_code
        description: "Código de track status de FastF1"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 4, 5, 6, 7]
              quote: false
              config:
                severity: warn
      - name: status_label
        description: "green / yellow / safety_car / red_flag / vsc_deployed / vsc_ending"
      - name: start_time_s
        description: "Inicio del periodo, en segundos desde el inicio de la sesión"
        tests:
          - not_null
      - name: end_time_s
        description: "Fin del periodo (inicio del siguiente o fin de sesión)"
        tests:
          - not_null
      - name: duration_s
        description: "Duración del periodo en segundos"
      - name: start_lap
        description: >
          Vuelta del líder en curso al empezar el periodo. 0 = pre-carrera (antes de
          que el líder empiece la vuelta 1). Tras la bandera a cuadros se usa la última vuelta.
        tests:
          - not_null
      - name: end_lap
        description: >
          Vuelta del líder en curso al terminar el periodo. 0 = el periodo termina antes
          de la salida. Tras la bandera a cuadros se usa la última vuelta.
        tests:
          - not_null
      - name: is_restart_procedure
        description: >
          Heurística: true si el periodo es un Safety Car que sigue directamente a una
          bandera roja (sin otra neutralización entre medias) y empieza a <= 2 vueltas
          del fin de la roja, es decir, el SC del procedimiento de reanudación y no uno
          por incidente. Validada contra race_control_messages con los 9 casos de SC
          tras bandera roja de 2022-2026 (6 reanudaciones, 3 SC reales). Límite conocido:
          un SC real a <= 2 vueltas de una reanudación se marcaría como true. Las
          reanudaciones que no generan periodo safety_car en track status no quedan reflejadas.
        tests:
          - not_null